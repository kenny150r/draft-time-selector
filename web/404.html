<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — eaten by a Wildcat</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #008080;
        color: #fff;
        font-family: Tahoma, sans-serif;
        display: grid;
        place-items: center;
        text-align: center;
      }
      .window {
        background: #c0c0c0;
        color: #000;
        border: 2px solid #fff;
        border-right-color: #000;
        border-bottom-color: #000;
        width: min(420px, 92vw);
        text-align: left;
      }
      .tb {
        background: #000080;
        color: #fff;
        padding: 4px 8px;
        font-weight: 700;
      }
      .body {
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="tb">C:\WINDOWS\404.EXE</div>
      <div class="body">
        <p><strong>Nice try, Wildcat.</strong></p>
        <p>
          Skipping is how Tucson wins. Stapley the paperclip has logged this act of cowardice and
          will mention it later.
        </p>
        <p>Returning you to the wizard in a moment. Resistance is required.</p>
        <p><a href="./">Take me back, I deserve this</a></p>
      </div>
    </div>
    <script>
      sessionStorage.setItem('whua-shame', '1');
      setTimeout(function () {
        location.href = './';
      }, 6500);
    </script>
  </body>
</html>
